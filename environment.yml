name: ribotranspred
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - numpy<2
  - pandas
  - scipy
  - matplotlib
  - pybigwig
  - pyfaidx
  - kipoiseq
  - deeptools=3.5.5
  - samtools
  - gffread
  - rich
  - pip
  - pip:
      - pytorch-lightning==2.5.3
      - torchmetrics>=1.3,<2
      - transformers>=4.40,<5
